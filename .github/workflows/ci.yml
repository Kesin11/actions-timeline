name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: npm ci
      - id: fmt
        run: npm run format:check
      - id: lint
        run: npm run lint
      - id: typecheck
        run: npm run typecheck
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: npm ci
      - name: Rebuild the dist/ directory
        run: npm run build
      - name: Verify dist/ is reproducible
        run: git diff --exit-code -- dist/

      # post processes
      - name: Upload dist for post job
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: js_dist
          path: |
            dist/
            action.yml
      - name: Create dist/*.js size json
        run: |
          find ./dist -type f -printf '%s %f\n' \
            | jq -n -R '{name: "dist_size", key: "dist_size", metrics: [inputs | capture("(?<value>\\S+)\\s+(?<key>.+)") + {unit: "KB"} | .value |= tonumber / 1024 | .name = .key ]}' \
            > dist_js_sizes.json
          cat dist_js_sizes.json
      # octocov must needs some coverage files but this job don't exec test, so put dummy file.
      - name: Create dummy coverage
        run: touch coverage.out
      - uses: k1LoW/octocov-action@v1
        env:
          OCTOCOV_CUSTOM_METRICS_DIST_JS: dist_js_sizes.json
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: npm ci
      - parallel:
          - run: npm test
          - name: CLI smoke test
            run: |
              RUN_URL=$(gh run list -L 1 -w release --json url --jq .[].url)
              node cli.ts -t "${GITHUB_TOKEN}" -o output.md "$RUN_URL"
              cat output.md
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run_self:
    runs-on: ubuntu-slim
    if: ${{ always() }}
    needs: [check, check-dist, test]
    steps:
      - name: Download bundled dist
        uses: actions/download-artifact@v8
        with:
          name: js_dist
      - name: Run self action with no options
        uses: ./
      - name: Run self action with 'show-waiting-runner=false'
        uses: ./
        with:
          show-waiting-runner: false
      - name: Run self action with 'expand-composite-actions=true'
        uses: ./
        with:
          expand-composite-actions: true
      - name: Run self action with 'expand-composite-actions=true' and 'expand-composite-actions-threshold'
        uses: ./
        with:
          expand-composite-actions: true
          # Always expand composite actions for dogfooding
          expand-composite-actions-threshold: 1
