name: Rebundle dist

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # Rebundle dist and push if changed from main branch
  rebundle-dist:
    runs-on: ubuntu-latest
    steps:
      # To bypass branch rule sets, we need to use GitHub App that allowed to bypass status check.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.BYPASS_APP_ID }}
          private-key: ${{ secrets.BYPASS_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: npm ci
      - name: Rebuild the dist/ directory
        run: npm run build
      - name: Commit and push dist/ if changed
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git add -u dist
            git commit -m "Rebuild Action distribution"
            git push origin main
          fi
